[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "image-to-ascii-gif"
version = "0.1.0"
description = "Turn images, GIFs, and videos into subtly animated ASCII art with PNG, GIF, MP4, and TXT export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ascii", "ascii-art", "animation", "gif", "mp4", "cli", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.urls]
Homepage = "https://github.com/kingrxben/image-to-ascii-gif"
Repository = "https://github.com/kingrxben/image-to-ascii-gif"
Issues = "https://github.com/kingrxben/image-to-ascii-gif/issues"

[project.scripts]
image-to-ascii-gif = "ascii_animator:main"
ascii-gif = "ascii_animator:main"

[tool.hatch.build.targets.wheel]
packages = ["ascii_animator.py"]
